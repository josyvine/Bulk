name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Decode Keystore from Base64 secret
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or missing on GitHub! Please add it in Settings > Secrets > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/safevoice.jks
          
          if [ ! -s ${{ github.workspace }}/safevoice.jks ]; then
            echo "::error::The decoded keystore file is empty (0 bytes). Check your Base64 encoding."
            exit 1
          fi
          echo "Keystore successfully decoded. Size: $(wc -c < ${{ github.workspace }}/safevoice.jks) bytes"

      # 2. Print SHA Fingerprints (using default alias 'bulk')
      - name: Print Keystore SHA Fingerprints
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'bulk' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is not set! Skipping fingerprint generation."
            exit 1
          fi
          keytool -list -v \
            -keystore ${{ github.workspace }}/safevoice.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD"

      # 3. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # 4. Generate fresh Gradle Wrapper
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper

      # 5. Grant execute permission to wrapper
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # 6. Payload DEX Compilation and AES-256 Encryption
      - name: Build and Encrypt Core Payload
        env:
          PAYLOAD_PASSPHRASE: "Bulk_Master_Secret_2026"
        run: |
          mkdir -p app/src/main/assets
          mkdir -p build/payload_dex

          # Compile release sources
          ./gradlew compileReleaseSources

          # Locate D8 and platform android.jar
          D8_TOOL=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -n 1)
          PLATFORM_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "Found D8 Tool at: $D8_TOOL"
          echo "Found Platform JAR at: $PLATFORM_JAR"

          # Collect compiled class files
          CLASS_FILES=$(find app/build -type f -name "*.class" ! -name "StubApplication*" ! -path "*/test*" ! -path "*/androidTest*")

          if [ -z "$CLASS_FILES" ]; then
            echo "::error::No compiled class files found in app/build!"
            exit 1
          fi

          echo "Packaging $(echo "$CLASS_FILES" | wc -w) class files into payload DEX..."

          # Build DEX
          $D8_TOOL --lib "$PLATFORM_JAR" --release --output build/payload_dex $CLASS_FILES

          # Encrypt DEX
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in build/payload_dex/classes.dex \
            -out app/src/main/assets/payload.bin \
            -k "$PAYLOAD_PASSPHRASE"

          rm -rf build/payload_dex
          echo "Payload DEX successfully encrypted into app/src/main/assets/payload.bin"

      # 7. Build Signed Release APK (Passing all Keystore credentials to Gradle)
      - name: Build Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/safevoice.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'bulk' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}

      # 8. Upload Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk